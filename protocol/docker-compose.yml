services:
  service-1:
    image: ubuntu:22.04
    volumes:
      - ./target/debug/examples:/app/examples
    command: /app/examples/sd 1 15
    networks:
      - development
    
  service-2:
    image: ubuntu:22.04
    volumes:
      - ./target/debug/examples:/app/examples
    command: /app/examples/sd 2 10
    networks:
      - development
    depends_on:
      - service-1

  service-3:
    image: ubuntu:22.04
    volumes:
      - ./target/debug/examples:/app/examples
    command: /app/examples/sd 3 5
    networks:
      - development
    depends_on:
      - service-1

networks:
  development:
    name: development