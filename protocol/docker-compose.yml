services:
  server:
    container_name: server
    image: ubuntu:22.04
    volumes:
      - ./target/debug/examples:/app/examples
    command: /app/examples/server
    networks:
      - development
    
  client:
    container_name: client
    image: ubuntu:22.04
    volumes:
      - ./target/debug/examples:/app/examples
    command: /app/examples/client
    networks:
      - development
    depends_on:
      - server

networks:
  development:
    name: development