services:
  service-1:
    container_name: service-1
    image: ubuntu:22.04
    volumes:
      - ./target/debug/examples:/app/examples
    command: /app/examples/app 1 15
    networks:
      - development
    
  service-2:
    container_name: service-2
    image: ubuntu:22.04
    volumes:
      - ./target/debug/examples:/app/examples
    command: /app/examples/app 2 7
    networks:
      - development
    depends_on:
      - service-1

  service-3:
    container_name: service-3
    image: ubuntu:22.04
    volumes:
      - ./target/debug/examples:/app/examples
    command: /app/examples/app 3 5
    networks:
      - development
    depends_on:
      - service-1

  service-4:
    container_name: service-4
    image: ubuntu:22.04
    volumes:
      - ./target/debug/examples:/app/examples
    command: /app/examples/app 4 3
    networks:
      - development
    depends_on:
      - service-1

networks:
  development:
    name: development